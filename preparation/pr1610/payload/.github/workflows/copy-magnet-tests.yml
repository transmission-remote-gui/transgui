name: Copy-magnet regression

on:
  pull_request:
    branches: [master]
    paths:
      - main.pas
      - tests/**
      - .github/workflows/copy-magnet-tests.yml
  push:
    branches: [master]
    paths:
      - main.pas
      - tests/**
      - .github/workflows/copy-magnet-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copy-magnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-magnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Free Pascal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl
      - name: Check routine extraction
        run: python3 -m unittest discover -s tests -p test_copy_magnet_runner.py -v
      - name: Check copy-magnet handling
        run: python3 tests/test_copy_magnet.py
