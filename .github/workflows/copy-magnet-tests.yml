name: Copy-magnet regression

on:
  pull_request:
    branches: [master]
    paths:
      - main.pas
      - tests/**
      - .github/workflows/copy-magnet-tests.yml
  push:
    branches: [master]
    paths:
      - main.pas
      - tests/**
      - .github/workflows/copy-magnet-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy-magnet:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Free Pascal
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fp-compiler fp-units-fcl
      - name: Check copy-magnet handling
        run: python3 tests/test_copy_magnet.py
