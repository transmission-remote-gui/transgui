name: rpctable unit tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpctable-tests:
    name: Test / rpctable unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Install Free Pascal
        run: |
          set -euo pipefail
          sudo apt-get update -yqq
          sudo apt-get install -yqq --no-install-recommends fp-compiler fp-units-fcl

      - name: Run rpctable unit tests
        run: |
          set -euo pipefail
          cd tests
          fpc -MObjFPC -Fu.. run_rpctable_tests.lpr
          ./run_rpctable_tests --all --format=plain
