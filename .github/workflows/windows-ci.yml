name: Windows CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows-build:
    name: Build / Windows / ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86
          - x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $lazarusArgs = @(
            'install',
            'lazarus',
            '--version=2.2.6',
            '--yes',
            '--no-progress'
          )
          if ('${{ matrix.arch }}' -eq 'x86') {
            $lazarusArgs += '--x86'
          }

          & choco @lazarusArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Lazarus: $LASTEXITCODE"
          }

          & choco install innosetup `
            --version=5.6.1 `
            --allow-downgrade `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Inno Setup: $LASTEXITCODE"
          }

          & choco install inno-download-plugin `
            --version=1.5.1 `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install Inno Download Plugin: $LASTEXITCODE"
          }

          & choco install zip `
            --version=3.0.0.20251001 `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install zip: $LASTEXITCODE"
          }

          & choco install upx `
            --version=5.2.0 `
            --yes `
            --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install UPX: $LASTEXITCODE"
          }

      - name: Build and test Windows artifacts
        shell: pwsh
        run: .\.github\scripts\build-windows.ps1 -Architecture '${{ matrix.arch }}'

      - name: Print SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem Release -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
              '{0}  {1}' -f $hash.Hash.ToLowerInvariant(), $_.Name
            }

      - uses: actions/upload-artifact@v7
        with:
          name: transgui-windows-${{ matrix.arch }}
          path: |
            Release/transgui-*.zip
            Release/transgui-*-setup*.exe
          if-no-files-found: error

  publish-release:
    name: Release / Windows assets
    runs-on: ubuntu-latest
    needs: windows-build
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 10
          persist-credentials: false

      - name: Set program version
        run: |
          set -euo pipefail
          echo "PROG_VER=$(head -n 1 VERSION.txt)" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Publish Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "artifacts/transgui-windows-x86/transgui-${PROG_VER}-i386-win32.zip"
            "artifacts/transgui-windows-x86/transgui-${PROG_VER}-setup.exe"
            "artifacts/transgui-windows-x86_64/transgui-${PROG_VER}-x86_64-win64.zip"
            "artifacts/transgui-windows-x86_64/transgui-${PROG_VER}-setup_64bit.exe"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing release asset: $file" >&2
              find artifacts -maxdepth 3 -type f -print >&2
              exit 1
            fi
          done

          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
              exit 0
            fi
            echo "Waiting for the main release workflow to create $GITHUB_REF_NAME ($attempt/60)..."
            sleep 30
          done

          echo "GitHub Release $GITHUB_REF_NAME was not created within 30 minutes." >&2
          exit 1
